              "editorMode": "code",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"llm-demo\",pod=~\"vllm-qwen25-7b.*\",container!=\"\",container!=\"POD\"}[$__rate_interval]))",
