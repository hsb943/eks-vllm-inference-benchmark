                "lineWidth": 2,
                "pointSize": 3,
                "showPoints": "never"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "mbytes"
            },
            "overrides": []
          },
